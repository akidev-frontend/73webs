# El valor de Cache-Control se decide por ruta y se emite una sola vez.
# Los assets de Astro llevan hash en el nombre, así que se cachean para siempre;
# todo lo demás (el HTML) revalida en cada carga para que un cambio de copy se
# vea al recargar.
map $uri $cache_control_value {
    default     "no-cache, must-revalidate";
    ~^/_astro/  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # nginx NO hereda add_header en un bloque hijo que declare cualquier
    # add_header propio. Por eso van todas juntas aquí arriba y ningún location
    # de abajo añade cabeceras: así ninguna ruta pierde las de seguridad.
    add_header Cache-Control $cache_control_value always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Astro genera carpetas (/tattoo/index.html), y en public/ hay .html sueltos
    # (aviso-legal.html). Probamos las tres formas antes de rendirnos.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    location /_astro/ {
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /favicon.svg { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml application/xml+rss;

    # Nada de puntos-fichero escondido salvo el .well-known de los certificados.
    location ~ /\.(?!well-known) { deny all; }

    # No hay src/pages/404.astro, así que no hay /404.html que servir.
    # Si lo añades, descomenta:
    # error_page 404 /404.html;
}

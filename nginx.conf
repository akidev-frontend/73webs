server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Astro genera carpetas (/tattoo/index.html), y en public/ hay .html sueltos
    # (aviso-legal.html). Probamos las tres formas antes de rendirnos.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Los assets de Astro llevan hash en el nombre: cachean para siempre.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # El HTML no se cachea: un cambio de copy tiene que verse al recargar.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml application/xml+rss;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nada de puntos-fichero escondido salvo el .well-known de los certificados.
    location ~ /\.(?!well-known) { deny all; }

    # No hay src/pages/404.astro, así que no hay /404.html que servir.
    # Si lo añades, descomenta:
    # error_page 404 /404.html;
}
